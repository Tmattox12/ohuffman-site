<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6efe6"/>
      <stop offset="60%" stop-color="#fdebd3"/>
      <stop offset="100%" stop-color="#f6d7b6"/>
    </linearGradient>
    <linearGradient id="mount" x1="0" x2="1">
      <stop offset="0%" stop-color="#d1a07a"/>
      <stop offset="100%" stop-color="#b57952"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- Distant mountains -->
  <path d="M0 230 L90 160 L160 200 L260 120 L380 210 L520 140 L700 220 L900 140 L1100 230 L1200 190 L1200 300 L0 300 Z" fill="url(#mount)" opacity="0.95" />

  <!-- Simple skyline shapes (stylized downtown Tucson) -->
  <g transform="translate(80,90) scale(0.9)">
    <rect x="40" y="80" width="60" height="100" rx="6" fill="#0b2545" />
    <rect x="110" y="40" width="80" height="140" rx="4" fill="#0b2545" opacity="0.9" />
    <rect x="200" y="100" width="50" height="80" rx="4" fill="#0b2545" opacity="0.95" />
    <rect x="270" y="30" width="90" height="150" rx="4" fill="#0b2545" opacity="0.9" />
    <rect x="380" y="70" width="40" height="110" rx="4" fill="#0b2545" />
    <rect x="440" y="60" width="70" height="120" rx="4" fill="#0b2545" />
    <rect x="520" y="95" width="50" height="85" rx="4" fill="#0b2545" />
  </g>

  <!-- Foreground desert silhouette -->
  <path d="M0 280 C80 240, 180 260, 260 240 C360 210, 460 250, 560 230 C660 210, 760 260, 900 240 C980 230, 1100 270, 1200 260 L1200 300 L0 300 Z" fill="#f0b078" opacity="0.95" />

  <!-- Small cacti accents -->
  <g fill="#7a4a2a" opacity="0.95">
    <rect x="140" y="210" width="8" height="28" rx="3" />
    <rect x="460" y="200" width="8" height="36" rx="3" />
    <rect x="820" y="210" width="8" height="28" rx="3" />
  </g>
</svg>
